[project]
name = "bo3_zm_probe"
sdk_version = "0.9.0"
game_root = "../loader_probe"

[entrypoint]
file_path = "../loader_probe/default_zm.xex"
out_directory_path = "generated"

# Entry inferred from the direct tail branch at 0x8285550C in the patched image.
# Seed discovery without imposing an unverified function size.
[entrypoint.functions]
0x828552B8 = { name = "sub_828552B8" }
# Separate leaf routine: emitted PPC listing spans 0x824DDF60..0x824DE004,
# ending in blr. Keeping its block bounds explicit fixes four branch placeholders.
0x824DDF60 = { name = "sub_824DDF60", end = 0x824DE008 }

